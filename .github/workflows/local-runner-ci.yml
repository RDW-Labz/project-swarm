name: "Local validation \u2014 z13 local (swarm)"
'on':
  workflow_dispatch: {}
  push:
    branches:
    - z13-local-ci-test
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 30
    strategy:
      matrix:
        node:
        - 20
        - 22
    runs-on:
    - self-hosted
    - z13
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ matrix.node }}
    - run: npm ci --ignore-scripts
    - run: npm test
    - run: npm run check
  browser-smoke:
    runs-on:
    - self-hosted
    - z13
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22
    - run: npm ci --ignore-scripts
    - run: npx playwright install --with-deps chromium
    - run: npm run test:browser
